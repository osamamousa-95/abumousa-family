# تشغيل البذرة من المتصفح: Actions ← Seed database ← Run workflow
# مصمَّم لمن يعمل من جهاز لوحي ولا يملك بيئة تطوير محلية.

name: Seed database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب SEED للتأكيد'
        required: true
        default: ''

jobs:
  seed:
    if: ${{ github.event.inputs.confirm == 'SEED' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy
      - name: Import the 271 notebook records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx prisma/seed.ts
