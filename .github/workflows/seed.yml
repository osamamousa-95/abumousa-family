# تشغيل البذرة من المتصفح: Actions ← Seed database ← Run workflow
name: Seed database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب SEED للتأكيد'
        required: true
        default: ''

jobs:
  seed:
    if: ${{ github.event.inputs.confirm == 'SEED' }}
    runs-on: ubuntu-latest
    # على مستوى المهمة كلها — فتصل إلى كل خطوة بما فيها prisma generate
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma db push --accept-data-loss
      - name: Import the 271 notebook records
        run: npx tsx prisma/seed.ts
